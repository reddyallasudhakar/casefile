description = "Add your description here"
authors = [
    { name = "sudhakar", email = "sudhakarreddy@policygaido.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "faker>=40.43.0",
    "google-cloud-vision>=3.16.0",
    "google-genai>=2.33.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
